global:
  resolve_timeout: 2m
route:
  receiver: local-inbox
  group_by: [job, alertname]
  group_wait: 5s
  group_interval: 15s
  repeat_interval: 4h
receivers:
  - name: local-inbox
    webhook_configs:
      - url: http://alert-receiver:8090/webhook
        send_resolved: true
        max_alerts: 20
        http_config:
          follow_redirects: false
inhibit_rules:
  - source_matchers: ['alertname="BackendScrapeUnavailable"']
    target_matchers: ['alertname=~"ResourceApiErrorBurst|MockBatchFailures"']
    equal: [job]
