global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: infrastructure-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8086]
